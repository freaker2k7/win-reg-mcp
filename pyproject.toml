[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win-reg-mcp"
version = "0.1.0"
description = "Local AI-powered Windows Registry MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
  "sqlite-vec==0.1.9",
  "pywin32>=306; platform_system == 'Windows'",
  "pyautogui>=0.9.54",
  "Pillow>=10.4",
  "opencv-python-headless>=4.10",
  "ddgs>=9.0",
  "typer>=0.29.1",
]

[project.optional-dependencies]
dev = [
  "black>=25.1",
  "ruff>=0.11",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pyinstaller>=6.12",
]

[project.scripts]
win-reg-mcp = "win_reg_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=win_reg_mcp --cov-report=term-missing --strict-markers"
testpaths = ["tests"]
